<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ABTI · 数据看板</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:720px;margin:0 auto;padding:48px 28px}.admin h1{font-size:42px}.admin p{line-height:1.6}.admin input{width:100%;height:54px;padding:0 16px;border:1px solid var(--line);border-radius:14px;font:inherit}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}.metric{padding:20px;border:1px solid var(--line);border-radius:16px}.metric b{display:block;font-size:38px}.ranking{padding:0;margin:0;list-style:none}.ranking li{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);font-weight:700}#dashboard[hidden]{display:none}</style></head>
<body><main class="admin"><p class="eyebrow">ABTI · PRIVATE ANALYTICS</p><h1>数据看板</h1><section id="login"><p>输入部署时设置的管理员口令。</p><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><p><button id="load" class="primary-button">查看汇总</button></p><p id="error"></p></section><section id="dashboard" hidden><div class="admin-grid"><div class="metric"><span>累计测试</span><b id="total">0</b></div><div class="metric"><span>近 7 天</span><b id="week">0</b></div></div><p class="block-label">人格排行榜</p><ol id="ranking" class="ranking"></ol><p class="block-label" style="margin-top:32px">近 7 天维度倾向</p><div id="dimensions" class="type-grid"></div></section></main>
<script>
const token=document.querySelector("#token"),error=document.querySelector("#error");
document.querySelector("#load").addEventListener("click",async()=>{error.textContent="";const response=await fetch("/api/stats",{headers:{"x-admin-token":token.value}});if(!response.ok){error.textContent=response.status===401?"口令不正确。":"暂时无法读取数据，请检查环境变量。";return}const data=await response.json();document.querySelector("#login").hidden=true;document.querySelector("#dashboard").hidden=false;document.querySelector("#total").textContent=data.total;document.querySelector("#week").textContent=data.last7Days;document.querySelector("#ranking").innerHTML=data.byResult.map((item,i)=>"<li><span>"+(i+1)+". "+item.name+" <small>"+item.code+"</small></span><b>"+item.count+"</b></li>").join("");document.querySelector("#dimensions").innerHTML=Object.entries(data.dimensions).map(([key,value])=>"<div><b>"+key+"</b><span>"+value+" 次选择</span></div>").join("")});
</script></body></html>
